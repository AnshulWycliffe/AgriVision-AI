{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card shadow-sm">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Create Account</h2>
            <p class="text-muted small">Join AgriVision AI today</p>
        </div>
        
        <form method="POST" action="">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" required placeholder="farmer123">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 ps-0" required placeholder="farmer@example.com">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" required placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill mb-3">Register</button>
        </form>
        
        <div class="text-center mt-3">
            <span class="text-muted small">Already have an account? </span>
            <a href="{{ url_for('auth.login') }}" class="text-success text-decoration-none fw-bold small">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
